<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo verde arredondado -->
  <rect width="512" height="512" rx="110" fill="#1D9E75"/>
  <!-- Sombra interna sutil -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" opacity="0.3"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1"/>
    </linearGradient>
  </defs>

  <!-- Carteira / wallet icon -->
  <g transform="translate(256,256)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Corpo da carteira -->
    <rect x="-140" y="-90" width="280" height="190" rx="24" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="18"/>
    <!-- Aba superior -->
    <path d="M-140,-90 L-140,-130 Q-140,-155 -116,-155 L116,-155 Q140,-155 140,-130 L140,-90" stroke="#ffffff" stroke-width="18" fill="#ffffff" fill-opacity="0.1"/>
    <!-- Compartimento do cartão -->
    <rect x="40" y="-20" width="100" height="65" rx="16" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="14"/>
    <!-- Moeda no compartimento -->
    <circle cx="90" cy="12" r="16" fill="#1D9E75" stroke="#ffffff" stroke-width="10"/>
    <!-- R$ símbolo -->
    <text x="90" y="19" text-anchor="middle" font-size="20" font-family="Arial,sans-serif" font-weight="bold" fill="#ffffff" stroke="none">$</text>
  </g>

  <!-- Letras FF discretas no canto -->
  <text x="430" y="490" text-anchor="end" font-size="36" font-family="Arial,sans-serif" font-weight="bold" fill="#ffffff" opacity="0.4">FF</text>
</svg>
